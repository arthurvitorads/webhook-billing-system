<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro de cobranças</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <nav aria-label="Páginas">
        <a href="/" aria-current="page">Cadastro</a>
        <a href="/pagar.html">Pagamentos</a>
      </nav>
      <h1>Cadastro de cobranças</h1>
      <div class="painel">
        <section>
          <h2>Nova cobrança</h2>
          <form id="criar">
            <label
              >Nome do cliente
              <input
                name="cliente"
                autocomplete="name"
                maxlength="255"
                required
              />
            </label>
            <label
              >Valor em reais
              <input
                type="number"
                name="valor"
                min="0.01"
                max="99999999.99"
                step="0.01"
                required
              />
            </label>
            <button type="submit">Cobrar</button>
          </form>
          <p id="mensagem" role="status"></p>
          <p id="erro" role="alert" hidden></p>
        </section>
        <section>
          <div class="cabecalho">
            <h2>Notificações de pagamento</h2>
            <button id="limpar" class="secundario" type="button" disabled>
              Limpar notificações
            </button>
          </div>
          <p id="notificacoes-mensagem" role="status"></p>
          <ul id="notificacoes" aria-live="polite"></ul>
        </section>
      </div>
      <section>
        <h2>Histórico de cobranças</h2>
        <label
          >Filtrar por status
          <select id="filtro">
            <option value="">Todos</option>
            <option value="pending">Pendente</option>
            <option value="approved">Aprovado</option>
            <option value="rejected">Rejeitado</option>
            <option value="cancelled">Cancelado</option>
          </select>
        </label>
        <p id="lista-mensagem" role="status"></p>
        <ul id="lista"></ul>
      </section>
    </main>
  </body>
</html>
